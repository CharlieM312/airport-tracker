name: Test

on:
 push:
    branches:
        - main
 pull_request:
    branches:
        - main
permissions:
  contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        name: Test
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
            - name: Cache Yarn Packages
              uses: actions/cache@v6
              with:
                path: .yarn/cache
                key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
                restore-keys: |
                  ${{ runner.os }}-yarn-
            - name: Install dependencies
              run: |
                corepack enable
                yarn install --immutable
            - name: Run tests
              run: |
                yarn test
    lint:
        runs-on: ubuntu-latest
        name: Lint
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
            - name: Cache Yarn Packages
              uses: actions/cache@v6
              with:
                path: .yarn/cache
                key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
                restore-keys: |
                  ${{ runner.os }}-yarn-
            - name: Install dependencies
              run: |
                corepack enable
                yarn install --immutable
            - name: Lint code
              run: |
                yarn lint:summary